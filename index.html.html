<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Farah</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:wght@400;500;600&display=swap');

  :root{
    --bg-deep: #1a0a12;
    --bg-mid: #2b0f1c;
    --rose: #c9436b;
    --rose-soft: #e88aa6;
    --gold: #d9b26a;
    --cream: #f6e9df;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-mid), var(--bg-deep) 70%);
    overflow-x:hidden;
    font-family:'Cormorant Garamond', serif;
    color:var(--cream);
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6vh 6vw;
    overflow:hidden;
  }

  /* ambient floating hearts */
  .float-heart{
    position:absolute;
    bottom:-10%;
    font-size:1.4rem;
    color:var(--rose-soft);
    opacity:0.55;
    animation: rise linear infinite;
    pointer-events:none;
    filter: drop-shadow(0 0 6px rgba(232,138,166,0.35));
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.6; }
    90%{ opacity:0.5; }
    100%{ transform: translateY(-115vh) translateX(var(--drift,20px)) rotate(25deg); opacity:0; }
  }

  .eyebrow{
    letter-spacing:0.45em;
    text-transform:uppercase;
    font-size:0.75rem;
    color:var(--gold);
    font-family:'Cormorant Garamond', serif;
    margin-bottom:1.4rem;
    opacity:0;
    animation: fadeIn 1.2s ease forwards 0.3s;
  }

  h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(2.4rem, 7vw, 5rem);
    line-height:1.15;
    background: linear-gradient(180deg, var(--cream) 0%, var(--rose-soft) 65%, var(--gold) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    animation: fadeIn 1.4s ease forwards 0.6s;
    text-shadow: 0 0 60px rgba(201,67,107,0.25);
  }

  h1 em{
    font-style:italic;
    color:var(--gold);
    -webkit-text-fill-color:var(--gold);
  }

  .sub{
    margin-top:1.6rem;
    font-size:clamp(1.05rem, 2.4vw, 1.4rem);
    color:var(--rose-soft);
    font-style:italic;
    max-width:36ch;
    opacity:0;
    animation: fadeIn 1.4s ease forwards 1s;
  }

  .divider{
    width:1px;
    height:60px;
    background:linear-gradient(var(--gold), transparent);
    margin:2.6rem 0;
    opacity:0;
    animation: fadeIn 1.2s ease forwards 1.3s;
  }

  .btn{
    position:relative;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold);
    font-family:'Cormorant Garamond', serif;
    letter-spacing:0.18em;
    text-transform:uppercase;
    font-size:0.9rem;
    padding:1rem 2.6rem;
    border-radius:999px;
    cursor:pointer;
    transition: all 0.5s ease;
    opacity:0;
    animation: fadeIn 1.2s ease forwards 1.6s;
  }
  .btn:hover{
    background:var(--gold);
    color:var(--bg-deep);
    box-shadow: 0 0 40px rgba(217,178,106,0.5);
    transform: translateY(-2px);
  }
  .btn:focus-visible{
    outline: 2px solid var(--cream);
    outline-offset: 4px;
  }

  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* reveal panel */
  .reveal{
    margin-top:3rem;
    max-width:640px;
    opacity:0;
    transform: scale(0.9);
    pointer-events:none;
    transition: opacity 0.9s ease, transform 0.9s cubic-bezier(.2,.9,.25,1);
  }
  .reveal.show{
    opacity:1;
    transform: scale(1);
    pointer-events:auto;
  }

    border: 1px solid rgba(217,178,106,0.5);
    border-radius: 18px;
    padding: 3.2rem 2rem;

    position:relative;
    overflow:hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.5);
  }

  .reveal-frame::before,
  .reveal-frame::after{
    content:"❤";
    position:absolute;
    color:var(--rose);
    font-size:1.1rem;
    opacity:0.7;
  }
  .reveal-frame::before{ top:-14px; left:-14px; }
  .reveal-frame::after{ bottom:-14px; right:-14px; }

  .reveal h2{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(1.8rem, 5vw, 2.8rem);
    color:var(--cream);
    line-height:1.3;
  }

  .reveal h2 span{
    color:var(--rose-soft);
  }

  .btn.hide-after{ display:none; }

  footer{
    margin-top:3.5rem;
    font-size:0.8rem;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color: rgba(246,233,223,0.35);
    opacity:0;
    animation: fadeIn 1.2s ease forwards 2s;
  }

  /* burst hearts on click */
  .burst-heart{
    position:fixed;
    font-size:1.2rem;
    color:var(--rose-soft);
    pointer-events:none;
    animation: burst 1.4s ease-out forwards;
    z-index:5;
  }
  @keyframes burst{
    0%{ opacity:1; transform: translate(0,0) scale(1); }
    100%{ opacity:0; transform: translate(var(--bx), var(--by)) scale(0.4); }
  }

  @media (prefers-reduced-motion: reduce){
    .float-heart, .burst-heart{ animation: none; display:none; }
    *{ animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="eyebrow">عيد ميلاد سعيد</div>
  <h1>الصغننة <em>كبرت سنة</em><br>عقبال سنينها كلها معايا 😍</h1>
  <p class="sub">النهاردة يوم مميز، لأن فيه حد مميز جدًا اتولد</p>

  <div class="divider"></div>

  <button class="btn" id="revealBtn">دوسي هنا</button>

  <div class="reveal" id="revealBox">
    <div class="reveal-frame">
      <h2>Happy Birthday <span>MY FARAH</span> 😍😍</h2>
    </div>
  </div>

  <footer>with love, always</footer>
</div>

<script>
  const stage = document.getElementById('stage');
  const btn = document.getElementById('revealBtn');
  const revealBox = document.getElementById('revealBox');

  // ambient floating hearts
  const hearts = ['❤','♡','✦'];
  function spawnAmbient(){
    const el = document.createElement('div');
    el.className = 'float-heart';
    el.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    el.style.left = Math.random()*100 + '%';
    el.style.setProperty('--drift', (Math.random()*80-40) + 'px');
    el.style.animationDuration = (7 + Math.random()*6) + 's';
    el.style.fontSize = (1 + Math.random()*1.3) + 'rem';
    stage.appendChild(el);
    setTimeout(()=> el.remove(), 14000);
  }
  setInterval(spawnAmbient, 550);
  for(let i=0;i<10;i++) setTimeout(spawnAmbient, i*300);

  // click burst + reveal
  btn.addEventListener('click', (e)=>{
    revealBox.classList.add('show');
    btn.classList.add('hide-after');

    for(let i=0;i<26;i++){
      const h = document.createElement('div');
      h.className = 'burst-heart';
      h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
      h.style.left = e.clientX + 'px';
      h.style.top = e.clientY + 'px';
      const angle = Math.random()*Math.PI*2;
      const dist = 80 + Math.random()*160;
      h.style.setProperty('--bx', Math.cos(angle)*dist + 'px');
      h.style.setProperty('--by', Math.sin(angle)*dist - 60 + 'px');
      document.body.appendChild(h);
      setTimeout(()=> h.remove(), 1500);
    }

    revealBox.scrollIntoView({behavior:'smooth', block:'center'});
  });
</script>

</body>
</html>
